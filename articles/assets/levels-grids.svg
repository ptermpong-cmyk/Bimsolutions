<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Level และ Grid ของอาคารสองชั้น</title>
  <desc id="desc">ระดับชั้นสองแนวนอนและกริดแนวตั้ง A B กับ 1 2 ช่วยกำหนดตำแหน่งเสาและพื้น</desc>
  <rect width="960" height="540" rx="28" fill="#eff6ff"/>
  <rect x="38" y="38" width="884" height="464" rx="24" fill="#fff" stroke="#d7e6f7" stroke-width="2"/>
  <text x="80" y="104" fill="#183153" font-family="Arial,sans-serif" font-size="30" font-weight="700">LEVEL + GRID</text>
  <text x="80" y="137" fill="#667d99" font-family="Arial,sans-serif" font-size="17">Reference system before placing building elements</text>
  <g stroke="#a9c8eb" stroke-width="2" stroke-dasharray="8 7">
    <line x1="285" y1="165" x2="285" y2="430"/><line x1="450" y1="165" x2="450" y2="430"/>
    <line x1="615" y1="165" x2="615" y2="430"/><line x1="220" y1="242" x2="690" y2="242"/>
    <line x1="220" y1="396" x2="690" y2="396"/>
  </g>
  <g fill="#fff" stroke="#2563eb" stroke-width="3">
    <circle cx="285" cy="178" r="22"/><circle cx="450" cy="178" r="22"/><circle cx="615" cy="178" r="22"/>
  </g>
  <g fill="#1748b5" font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle">
    <text x="285" y="185">A</text><text x="450" y="185">B</text><text x="615" y="185">C</text>
  </g>
  <g fill="#dbeafe" stroke="#2563eb" stroke-width="4">
    <rect x="275" y="246" width="20" height="150" rx="2"/>
    <rect x="440" y="246" width="20" height="150" rx="2"/>
    <rect x="605" y="246" width="20" height="150" rx="2"/>
  </g>
  <rect x="245" y="232" width="405" height="18" rx="3" fill="#60a5fa"/>
  <rect x="245" y="388" width="405" height="18" rx="3" fill="#2563eb"/>
  <g stroke="#fb923c" stroke-width="3" fill="none">
    <line x1="720" y1="242" x2="765" y2="242"/><line x1="720" y1="396" x2="765" y2="396"/>
  </g>
  <g fill="#9a4c0b" font-family="Arial,sans-serif" font-size="17" font-weight="700">
    <text x="778" y="248">LEVEL 2</text><text x="778" y="402">LEVEL 1</text>
  </g>
  <text x="450" y="466" fill="#46617f" font-family="Arial,sans-serif" font-size="17" text-anchor="middle">Grid A–C positions the columns · Levels set floor heights</text>
</svg>
